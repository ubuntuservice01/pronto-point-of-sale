name: Pronto POS - Backup independente

on:
  schedule:
    - cron: '15 1 * * *' # 03:15 em Moçambique (UTC+2)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pronto-pos-offsite-backup
  cancel-in-progress: false

jobs:
  backup:
    # Enable only after the separate S3 bucket, age public key and secrets are configured.
    if: ${{ vars.PRONTO_BACKUP_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PRONTO_BACKUP_DATABASE_URL: ${{ secrets.PRONTO_BACKUP_DATABASE_URL }}
      PRONTO_BACKUP_AGE_RECIPIENT: ${{ vars.PRONTO_BACKUP_AGE_RECIPIENT }}
      PRONTO_BACKUP_S3_BUCKET: ${{ vars.PRONTO_BACKUP_S3_BUCKET }}
      PRONTO_BACKUP_S3_ENDPOINT: ${{ vars.PRONTO_BACKUP_S3_ENDPOINT }}
      PRONTO_BACKUP_EXPECTED_PROJECT_REF: xgtpvszwzvkwysrswkek
      AWS_ACCESS_KEY_ID: ${{ secrets.PRONTO_BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PRONTO_BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.PRONTO_BACKUP_S3_REGION }}
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_RETRY_MODE: standard
      AWS_MAX_ATTEMPTS: '5'
    steps:
      - name: Checkout seguro
        uses: actions/checkout@v4
      - name: Instalar ferramentas de encriptação e S3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age awscli
      - name: Cópia PostgreSQL 17 encriptada e verificação do destino
        run: bash scripts/backup-offsite.sh
