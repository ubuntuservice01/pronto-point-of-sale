name: Pronto POS Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and imports
        run: npm run check
      - name: Automated tests
        run: npm test
      - name: Build static preview
        run: npm run build
      - name: Verify bundled source modules
        run: |
          test -f dist/src/quality.js
          test -f dist/src/commercial-ui.js
          test -f dist/index.html
